version: 2

builds:
  - main: ./cmd/strspc
    binary: strspc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: >-
      strspc_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: darwin
        formats: [zip]
    # Listing files at all overrides GoReleaser's defaults, so LICENSE and
    # README are re-listed here alongside NOTICE (not covered by the defaults).
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
