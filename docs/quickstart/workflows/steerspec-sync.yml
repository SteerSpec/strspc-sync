name: SteerSpec Sync
on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'steerspec-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SteerSpec/strspc-sync/sync@v0.2.5
        with:
          dry-run: false
          # The default workflow token cannot open PRs in other repositories,
          # so pass a PAT (or App installation token) with contents and
          # pull_requests write on every target repo.
          token: ${{ secrets.STEERSPEC_TOKEN }}
          # For auth.method: github-app, pass these instead of token:
          # app-id: ${{ secrets.STEERSPEC_APP_ID }}
          # private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}
