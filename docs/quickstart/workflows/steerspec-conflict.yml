name: SteerSpec Conflict Detection
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  conflict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SteerSpec/strspc-sync/conflict@v0.2.6
        with:
          tiers: '1,2'
          # Must be able to read target repos; the default workflow token only
          # reaches the current repository.
          token: ${{ secrets.STEERSPEC_TOKEN }}
