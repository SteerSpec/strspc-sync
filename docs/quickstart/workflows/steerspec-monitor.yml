name: SteerSpec Monitor
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# One monitor run at a time, so a manual run and the scheduled one don't both open an issue for the same drift.
# A queued run waits rather than cancelling the one in progress.
concurrency:
  group: steerspec-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SteerSpec/strspc-sync/monitor@v0.4.1
        with:
          # Must be able to read target repos and open issues in them; the
          # default workflow token only reaches the current repository.
          token: ${{ secrets.STEERSPEC_TOKEN }}
