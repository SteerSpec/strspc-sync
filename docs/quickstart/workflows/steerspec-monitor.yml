name: SteerSpec Monitor
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SteerSpec/strspc-sync/monitor@v0.2.8
        with:
          # Must be able to read target repos and open issues in them; the
          # default workflow token only reaches the current repository.
          token: ${{ secrets.STEERSPEC_TOKEN }}
