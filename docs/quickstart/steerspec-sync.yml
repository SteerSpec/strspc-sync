version: "1.0.0"

# The repository this file lives in. Template `source` paths below are read
# from the root of this repo, and `.steerspec/deployment-state.json` is
# written back to it. Optional when running in GitHub Actions, where it
# defaults to the repository running the workflow.
central-repo: acme-corp/steerspec-config

auth:
  method: github-token
  # The token is read from the GITHUB_TOKEN env var. In GitHub Actions the
  # SteerSpec/strspc-sync action sets it from its `token` input; the default
  # workflow token can only reach the current repository, so pass a PAT (or a
  # GitHub App installation token) with `contents` and `pull_requests` write on
  # every target repo. See workflows/steerspec-sync.yml.
  #
  # Alternative: a GitHub App, which is confined to the repos it is installed on.
  #   method: github-app
  # Credentials resolved from env vars (set by the action's app-id, private-key
  # and installation-id inputs):
  #   STEERSPEC_APP_ID            — GitHub App ID
  #   STEERSPEC_PRIVATE_KEY       — PEM string or path to .pem file
  #   STEERSPEC_INSTALLATION_ID   — optional; auto-discovered from org if omitted
  # Required GitHub App permissions:
  #   Contents: Read & Write
  #   Pull requests: Read & Write
  #   Issues: Read & Write
  # Install on all org repos (or selected target repos)

variables:
  org_name: "acme-corp"
  default_model: "claude-sonnet-4-6"
  coding_standards_url: "https://acme-corp.dev/standards"

# Every `source` is a path in this repo; every `destination` is the path Claude
# Code reads in the target repo (CLAUDE.md, .claude/agents/<name>.md,
# .claude/skills/<name>/SKILL.md, .claude/settings.json).
templates:
  # The marker strategy replaces the STEERSPEC:BEGIN/END sections it finds in
  # the template, leaving the rest of the target file untouched. Which sections
  # are managed is decided by the markers in templates/CLAUDE.md.mustache itself.
  - id: claude-md
    version: "1.0.0"
    type: claude-md
    source: templates/CLAUDE.md.mustache
    destination: CLAUDE.md
    strategy: marker

  - id: agent-code-review
    version: "1.0.0"
    type: agent
    source: templates/agents/code-review.md
    destination: .claude/agents/code-review.md
    strategy: full-replace

  - id: skill-commit
    version: "1.0.0"
    type: skill
    source: templates/skills/commit/SKILL.md
    destination: .claude/skills/commit/SKILL.md
    strategy: full-replace

  - id: claude-settings
    version: "1.0.0"
    type: config
    source: templates/settings.json.mustache
    destination: .claude/settings.json
    strategy: mustache

targets:
  include:
    - "acme-corp/*"
  exclude:
    - "acme-corp/archived-*"
    - "acme-corp/.github"
    - "acme-corp/steerspec-config"
  topics:
    - claude-managed
  overrides:
    - repo: acme-corp/api-server
      default_branch: develop
      variables:
        project_type: "api"
      exclude_templates:
        - claude-settings
    - repo: acme-corp/frontend
      variables:
        project_type: "frontend"
        default_model: "claude-sonnet-4-6"

sync:
  concurrency: 5
  pr-label: steerspec-sync
  close-stale-prs: true

monitor:
  schedule: "0 8 * * 1"
  issue-label: steerspec-drift
  auto-close: true

conflicts:
  schedule: "0 9 * * 1"
  tiers: [1, 2]
  issue-label: steerspec-conflict
