name: 'SteerSpec Sync - Sync'
description: 'Synchronize templates to target repositories'
author: 'SteerSpec'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  config-path:
    description: 'Path to steerspec-sync.yml config file'
    required: false
    default: 'steerspec-sync.yml'
  dry-run:
    description: 'Preview changes without creating PRs'
    required: false
    default: 'false'
  target-filter:
    description: 'Comma-separated owner/repo glob patterns; only matching target repositories are processed'
    required: false
    default: ''
  template-filter:
    description: 'Comma-separated template ID glob patterns to sync'
    required: false
    default: ''
  force:
    description: 'Force sync even if deployment state shows current version'
    required: false
    default: 'false'
  token:
    description: >-
      GitHub token used when `auth.method` is `github-token`. Defaults to the workflow
      token, which cannot open pull requests in other repositories — pass a PAT or App
      installation token for cross-repo sync.
    required: false
    default: ${{ github.token }}
  app-id:
    description: 'GitHub App ID (for github-app auth method)'
    required: false
    default: ''
  private-key:
    description: 'GitHub App private key — inline PEM or file path (for github-app auth method)'
    required: false
    default: ''
  installation-id:
    description: 'GitHub App installation ID (optional; auto-discovered from org if omitted)'
    required: false
    default: ''

outputs:
  prs-created:
    description: 'Number of new PRs created'
    value: ${{ steps.run.outputs.prs-created }}
  prs-updated:
    description: 'Number of existing PRs updated'
    value: ${{ steps.run.outputs.prs-updated }}
  repos-skipped:
    description: 'Repo and template pairs left unchanged without error (up to date, symlink, dry run)'
    value: ${{ steps.run.outputs.repos-skipped }}
  errors:
    description: 'Repo and template pairs that failed, plus one if the deployment state was not saved'
    value: ${{ steps.run.outputs.errors }}
  summary:
    description: 'JSON summary of the operation'
    value: ${{ steps.run.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "os=${OS}" >> "$GITHUB_OUTPUT"
        echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"

    - name: Download strspc binary
      shell: bash
      run: |
        VERSION="$(cat "${{ github.action_path }}/../VERSION")"
        OS="${{ steps.platform.outputs.os }}"
        ARCH="${{ steps.platform.outputs.arch }}"
        BASE="https://github.com/SteerSpec/strspc-sync/releases/download"
        ARCHIVE="${BASE}/v${VERSION}/strspc_${VERSION}_${OS}_${ARCH}"
        # The release publishes darwin builds as .zip and linux builds as .tar.gz (.goreleaser.yml).
        if [ "$OS" = "darwin" ]; then
          ZIP="${RUNNER_TEMP:-/tmp}/strspc.zip"
          curl -fsSL -o "${ZIP}" "${ARCHIVE}.zip"
          unzip -o -q "${ZIP}" strspc -d /usr/local/bin
          rm -f "${ZIP}"
        else
          curl -fsSL "${ARCHIVE}.tar.gz" | tar xz -C /usr/local/bin strspc
        fi
        chmod +x /usr/local/bin/strspc

    - name: Run strspc sync
      id: run
      shell: bash
      env:
        # `||` so a caller that passes an unset secret (empty string) still gets
        # the workflow token instead of a hard "token is required" failure.
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        STEERSPEC_APP_ID: ${{ inputs.app-id }}
        STEERSPEC_PRIVATE_KEY: ${{ inputs.private-key }}
        STEERSPEC_INSTALLATION_ID: ${{ inputs.installation-id }}
        # Inputs reach the script as environment variables, never interpolated
        # into it, so a value cannot inject shell syntax.
        STRSPC_INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        STRSPC_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        STRSPC_INPUT_TARGET_FILTER: ${{ inputs.target-filter }}
        STRSPC_INPUT_TEMPLATE_FILTER: ${{ inputs.template-filter }}
        STRSPC_INPUT_FORCE: ${{ inputs.force }}
      run: |
        args=(sync --config "$STRSPC_INPUT_CONFIG_PATH")
        if [ "$STRSPC_INPUT_DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ -n "$STRSPC_INPUT_TARGET_FILTER" ]; then
          args+=(--target-filter "$STRSPC_INPUT_TARGET_FILTER")
        fi
        if [ -n "$STRSPC_INPUT_TEMPLATE_FILTER" ]; then
          args+=(--template-filter "$STRSPC_INPUT_TEMPLATE_FILTER")
        fi
        if [ "$STRSPC_INPUT_FORCE" = "true" ]; then
          args+=(--force)
        fi
        strspc "${args[@]}"
