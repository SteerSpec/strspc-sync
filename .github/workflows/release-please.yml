name: Release Please

# Keeps a release PR open that bumps VERSION and the changelog from the
# conventional commits promoted from develop to main. Merging it creates the vX.Y.Z tag and GitHub
# release, and the tag push runs release.yml (VERSION check, tests, GoReleaser).

on:
  push:
    branches: [main]

# The App token does the work; GITHUB_TOKEN needs nothing.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint a GitHub App token
        # steerspec-sync App: its PRs trigger CI and auto-approve (unlike GITHUB_TOKEN),
        # its API commits are GitHub-signed (required_signatures) and its author
        # steerspec-sync[bot] is not the approving bot, so auto-approve can act.
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.STEERSPEC_APP_ID }}
          private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # Not GITHUB_TOKEN: its tag pushes would not trigger release.yml and its
          # PRs get no CI. Not a PAT either: PAT commits are unsigned.
          token: ${{ steps.app.outputs.token }}
          # The default branch is develop; releases are cut from main, the
          # promotion target. Without this the release PR would target develop.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please writes VERSION, the manifest and CHANGELOG.md only to main. After a
  # release, open a PR that copies them to develop, so branches cut from develop carry the
  # released version (the actions download the binary VERSION names). GH #183.
  sync-develop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint a GitHub App token
        # Same App as above: its PR triggers CI and auto-approve, and its API commit is GitHub-signed.
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.STEERSPEC_APP_ID }}
          private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Open the release sync PR against develop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/sync-release-to-develop.sh "$VERSION"
