name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report and threshold
        env:
          THRESHOLD: '70'
        run: |
          # Actions' default shell is `bash -e`, which does not set pipefail, so a
          # failure inside the pipeline below would be masked and $total left empty.
          # The gate still fails closed (awk coerces "" to 0, under any threshold),
          # but it would misreport a broken profile as low coverage.
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3+0}')
          if [ -z "$total" ]; then
            echo "::error::no 'total:' line in coverage.out - the profile is missing or malformed"
            exit 1
          fi
          {
            echo "## Coverage"
            echo
            echo "**${total}%** of statements (threshold: ${THRESHOLD}%)"
            echo
            echo '<details><summary>Per-function breakdown</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$THRESHOLD" -v c="$total" 'BEGIN {
            if (c+0 < t+0) {
              printf "Coverage %s%% is below the %s%% threshold\n", c, t
              exit 1
            }
            printf "Coverage %s%% meets the %s%% threshold\n", c, t
          }'
      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.2

  lint-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.yml
          globs: |
            **/*.md
            !node_modules/**
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
