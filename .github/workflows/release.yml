name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The composite actions download the binary named by VERSION at the tag ref.
      - name: VERSION matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Same read as the actions ($(cat VERSION)): no whitespace normalisation.
          if [ "v$(cat VERSION)" != "$TAG" ]; then
            echo "::error::VERSION ($(cat VERSION)) does not match tag $TAG"
            exit 1
          fi
      - name: Pre-flight tests
        run: go test -race ./...
      - name: Build smoke test
        run: go build -o /tmp/strspc ./cmd/strspc && /tmp/strspc version
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
